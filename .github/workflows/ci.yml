name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  documentation:
    name: Documentation and LFS integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r scripts/docs/requirements.txt

      - name: Validate context routes
        run: python scripts/docs/validate_routes.py

      - name: Test baseline regression cases
        run: python -m unittest discover -s tests/docs -p 'test_*.py' -v

      - name: Verify recovered LFS objects
        run: |
          git lfs fsck --objects --pointers
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          listing = json.loads(subprocess.check_output(
              ["git", "lfs", "ls-files", "--json"], text=True
          ))
          files = listing.get("files", [])
          if not files:
              raise SystemExit("No LFS objects found; baseline binaries must be tracked")
          for entry in files:
              path = Path(entry["name"])
              if entry.get("oid_type") != "sha256" or not path.is_file():
                  raise SystemExit(f"Invalid or missing LFS object: {path}")
              if path.stat().st_size != entry["size"]:
                  raise SystemExit(f"LFS size mismatch (possibly an unrecovered pointer): {path}")
              with path.open("rb") as handle:
                  digest = hashlib.file_digest(handle, "sha256").hexdigest()
              if digest != entry["oid"]:
                  raise SystemExit(f"Recovered LFS bytes do not match the pointer: {path}")
          print(f"Verified {len(files)} recovered LFS objects")
          PY

      - name: Validate baseline lineage and hashes
        env:
          BASELINE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/docs/validate_baselines.py --base-ref "$BASELINE_BASE_REF"

      - name: Verify generated decision log
        run: |
          python scripts/docs/build_decision_log.py \
            docs/governance/DECISIONS.yaml "${RUNNER_TEMP}/DECISION_LOG.md"
          cmp -- docs/governance/DECISION_LOG.md "${RUNNER_TEMP}/DECISION_LOG.md"

  inc-000:
    name: INC-000 foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'

      - name: Test backend
        run: python -m pytest backend/tests

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
